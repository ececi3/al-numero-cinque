spring:
  datasource:
    url: jdbc:h2:mem:alnumerocinque-test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

app:
  eventi-async:
    # OutboxPublisher e KdsWebSocketBridge disattivati di default nei test:
    # nessun broker Kafka disponibile. I test che verificano questi
    # componenti (con @EmbeddedKafka) sovrascrivono questa proprieta' e
    # riattivano KafkaAutoConfiguration esplicitamente.
    enabled: false
